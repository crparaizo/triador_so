<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 200" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1020" height="200" fill="#ffffff"/>

  <g stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M150,110 L181,110"/>
    <path d="M375,110 L406,110"/>
    <path d="M570,110 L601,110"/>
    <path d="M785,110 L816,110"/>
  </g>

  <rect x="20" y="70" width="130" height="80" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.6"/>
  <text x="85" y="106" text-anchor="middle" fill="#111827" font-size="13">
    <tspan x="85" dy="0">Relato textual</tspan><tspan x="85" dy="17">da ocorrência</tspan>
  </text>

  <rect x="185" y="70" width="190" height="80" rx="8" fill="#e7edfb" stroke="#374151" stroke-width="1.6"/>
  <text x="280" y="106" text-anchor="middle" fill="#111827" font-size="13">
    <tspan x="280" dy="0">Montagem do prompt</tspan><tspan x="280" dy="17">(contexto + relato)</tspan>
  </text>

  <rect x="410" y="70" width="160" height="80" rx="8" fill="#e7edfb" stroke="#374151" stroke-width="1.6"/>
  <text x="490" y="106" text-anchor="middle" fill="#111827" font-size="13">
    <tspan x="490" dy="0">Chamada ao</tspan><tspan x="490" dy="17">modelo (LLM)</tspan>
  </text>

  <rect x="605" y="70" width="180" height="80" rx="8" fill="#e7edfb" stroke="#374151" stroke-width="1.6"/>
  <text x="695" y="106" text-anchor="middle" fill="#111827" font-size="13">
    <tspan x="695" dy="0">Análise da</tspan><tspan x="695" dy="17">resposta (JSON)</tspan>
  </text>

  <rect x="820" y="65" width="160" height="90" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.6"/>
  <text x="900" y="106" text-anchor="middle" fill="#111827" font-size="13">
    <tspan x="900" dy="0" font-weight="bold">Resultado</tspan><tspan x="900" dy="17">(classificação)</tspan>
  </text>
