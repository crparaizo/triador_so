<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="400" fill="#ffffff"/>

  <!-- Arrows: Relato -> abordagens -->
  <g stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M170,210 L206,96"/>
    <path d="M170,210 L206,210"/>
    <path d="M170,210 L206,324"/>
    <!-- abordagens -> saida -->
    <path d="M385,93 L426,204"/>
    <path d="M385,210 L426,210"/>
    <path d="M385,327 L426,216"/>
    <!-- saida -> comparacao -->
    <path d="M600,210 L646,210"/>
    <!-- comparacao -> metricas -->
    <path d="M810,210 L856,210"/>
  </g>

  <!-- Relato -->
  <rect x="20" y="165" width="150" height="90" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.6"/>
  <text x="95" y="205" text-anchor="middle" fill="#111827" font-size="14">
    <tspan x="95" dy="0">Relato textual</tspan>
    <tspan x="95" dy="18">da ocorrência</tspan>
  </text>

  <!-- Abordagens -->
  <g>
    <rect x="210" y="60" width="175" height="66" rx="8" fill="#e7edfb" stroke="#374151" stroke-width="1.6"/>
    <text x="297" y="88" text-anchor="middle" fill="#111827" font-size="14">
      <tspan x="297" dy="0">Abordagem por</tspan>
      <tspan x="297" dy="18">regras de produção</tspan>
    </text>

    <rect x="210" y="177" width="175" height="66" rx="8" fill="#e7edfb" stroke="#374151" stroke-width="1.6"/>
    <text x="297" y="205" text-anchor="middle" fill="#111827" font-size="14">
      <tspan x="297" dy="0">Abordagem por</tspan>
      <tspan x="297" dy="18">LLM puro</tspan>
    </text>

    <rect x="210" y="294" width="175" height="66" rx="8" fill="#e7edfb" stroke="#374151" stroke-width="1.6"/>
    <text x="297" y="322" text-anchor="middle" fill="#111827" font-size="14">
      <tspan x="297" dy="0">Abordagem híbrida</tspan>
      <tspan x="297" dy="18">(neurossimbólica)</tspan>
    </text>
  </g>

  <!-- Saida padronizada -->
  <rect x="430" y="150" width="170" height="120" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.6"/>
  <text x="515" y="183" text-anchor="middle" fill="#111827" font-size="13">
    <tspan x="515" dy="0" font-size="14" font-weight="bold">Saída padronizada</tspan>
    <tspan x="515" dy="20">urgência, prioridade,</tspan>
    <tspan x="515" dy="17">categoria, equipe,</tspan>
    <tspan x="515" dy="17">revisão humana</tspan>
  </text>

  <!-- Comparacao -->
  <rect x="650" y="170" width="160" height="80" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.6"/>
  <text x="730" y="205" text-anchor="middle" fill="#111827" font-size="14">
    <tspan x="730" dy="0">Comparação</tspan>
    <tspan x="730" dy="18">com o gabarito</tspan>
  </text>

  <!-- Metricas -->
  <rect x="860" y="150" width="200" height="120" rx="8" fill="#eef3ee" stroke="#374151" stroke-width="1.6"/>
  <text x="960" y="183" text-anchor="middle" fill="#111827" font-size="13">
    <tspan x="960" dy="0" font-size="14" font-weight="bold">Métricas</tspan>
    <tspan x="960" dy="20">assertividade, latência,</tspan>
    <tspan x="960" dy="17">consumo de tokens,</tspan>
    <tspan x="960" dy="17">auditabilidade</tspan>
  </text>
</svg>
