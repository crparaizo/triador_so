# =============================================================================
# categories.yaml — Categorias de falha e palavras-chave para o motor de regras
#
# AVISO: Dados sintéticos para protótipo acadêmico de triagem de OS industriais.
#
# Estrutura: dicionário cujas chaves correspondem aos valores do enum
# FailureCategory (exceto FORA_DO_ESCOPO e DESCONHECIDA, tratadas pelo motor).
#
# Cada categoria contém:
#   descricao      : descrição da categoria para documentação
#   equipe_padrao  : equipe responsável pelo atendimento padrão
#   urgencia_padrao: nível de urgência padrão (IMEDIATA, ALTA, MEDIA, BAIXA)
#   palavras_chave : lista de termos (≥20) em português, incluindo variações,
#                    abreviações e termos técnicos usados no chão de fábrica
#
# Terminologia: os termos de falha, defeito, manutenção e criticidade usados
# neste protótipo seguem a ABNT NBR 5462:1994 (Confiabilidade e mantenabilidade).
# A fundamentação normativa e o glossário estão em datasets/DATASET_README.md.
# =============================================================================

